.source)||ids.includes(e.dataset.target);e.style.opacity=active?'1':'.08';if(active){document.getElementById(e.dataset.source).classList.add('active-row');document.getElementById(e.dataset.target).classList.add('active-row')}})}function reset(){edges.forEach(e=>e.style.opacity='1');document.querySelectorAll('.active-row').forEach(e=>e.classList.remove('active-row'))}edges.forEach(e=>{e.addEventListener('mouseenter',()=>{reset();highlight([e.dataset.source]);});e.addEventListener('mouseleave',reset)});document.querySelectorAll('.field-row').forEach(e=>{e.addEventListener('mouseenter',()=>{reset();highlight([e.id])});e.addEventListener('mouseleave',reset)});apply();</script></body></html>
